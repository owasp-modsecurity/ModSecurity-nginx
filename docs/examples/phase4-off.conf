# nginx example: phase-4 mode "off" (the default)
# Uses native intervention handling. This does not disable ModSecurity or
# response-body inspection; late native interventions can fail the response.
# The connector's additional intervention policy is disabled.

http {
    upstream app_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name example.local;

        modsecurity on;
        modsecurity_phase4_mode off;

        # Illustrative rules; adapt to your application before deployment.
        # MIME selection and inspection limits belong to the engine.
        # The legacy modsecurity_phase4_body_limit setting is ignored.
        # Reset the MIME list in a separate engine rule load.
        modsecurity_rules 'SecResponseBodyMimeTypesClear';
        modsecurity_rules '
            SecRuleEngine On
            SecResponseBodyAccess On
            SecResponseBodyLimit 1048576
            SecResponseBodyLimitAction ProcessPartial
            SecResponseBodyMimeType text/html text/plain application/json
            SecRule RESPONSE_BODY "@rx sensitive-marker" "id:940101,phase:4,deny,log,status:403"
        ';

        location / {
            proxy_pass http://app_backend;
        }
    }
}
