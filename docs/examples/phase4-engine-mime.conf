# ModSecurity rules file: engine response-body MIME additions and limit policy
# Load with modsecurity_rules_file alongside your other rules.
# This is not an nginx include and not a connector MIME allowlist.
# To replace the engine MIME list, load a separate reset BEFORE this file:
# modsecurity_rules 'SecResponseBodyMimeTypesClear';
# modsecurity_rules_file /etc/modsecurity/phase4-engine-mime.conf;
# Keep the reset in a separate rule load from the MIME additions.
# Adapt this list to the response types your application needs to inspect.

SecResponseBodyAccess On
# Example engine inspection limit; independent of modsecurity_phase4_mode.
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial
SecResponseBodyMimeType text/html text/plain application/json application/problem+json application/xml application/xhtml+xml
